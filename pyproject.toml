[project]
name = "chess-ds"
version = "0.1.0"
description = "Chess Data Science, Engine Benchmarking, and Analytics Platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chess>=1.10.0",
    "berserk>=0.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"
