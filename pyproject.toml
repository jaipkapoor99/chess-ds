[project]
name = "chess-ds"
version = "0.1.0"
description = "Chess Data Science, Engine Benchmarking, and Analytics Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10.0",
    "berserk>=0.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "zstandard>=0.25.0",
    "pyrefly>=0.1.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined variables)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bug prevention)
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled gracefully by formatter)
    "B008", # do not perform function calls in argument defaults
    "B905", # zip without explicit strict
]

[tool.ruff.lint.isort]
known-first-party = ["chess_ds"]

[tool.pyrefly]
mode = "standard"
strictness = "reasonable"

[tool.mdformat]
wrap = "no"
number = true
